name: Test
on:
  push:
    branches:
      - "**/*"
    tags:
      - "v*"
      - "*@v*"
  schedule:
    - cron:  '30 0 * * 0' # Sunday Only

jobs:
  perl:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config:
          - { image: centos7 }
          - { image: bullseye }
          - { image: fedora35 }
          - { image: fedora37 }
          - { image: fedora40 }
          - { image: fedora42 }
          - { image: fedora43 }
          # skip php tests until ADOdb deprecation warnings on PHP 8.5 are resolved in MT core
          - { image: fedora44, phpunit: false, skip_php: true }
          - { image: cloud7 }
        admin_theme_id:
          - legacy
          - admin2023
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          repository: movabletype/movabletype
          ref: develop
          path: mt
      - uses: docker/login-action@v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/mt:/app \
            -v ${{ github.workspace }}/plugins/MTBlockEditor:/app/plugins/MTBlockEditor \
            -w /app \
            -e MT_TEST_ENV_ADMIN_THEME_ID=${{ matrix.admin_theme_id }} \
            -e MT_TEST_SKIP_PHP=${{ matrix.config.skip_php }} \
            ghcr.io/movabletype/movabletype/test:${{ matrix.config.image }} \
            prove -j4 -PMySQLPool=MT::Test::Env -It/lib \
              plugins/MTBlockEditor/t
      - name: phpunit
        if: matrix.config.phpunit != false
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/mt:/app \
            -v ${{ github.workspace }}/plugins/MTBlockEditor:/app/plugins/MTBlockEditor \
            -w /app \
            -e MT_TEST_ENV_ADMIN_THEME_ID=${{ matrix.admin_theme_id }} \
            ghcr.io/movabletype/movabletype/test:${{ matrix.config.image }} \
            phpunit plugins/MTBlockEditor/php

  js:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build schema
        run: npm run build-schema

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format

      - name: Build
        run: npm run build

      - name: Cypress run
        uses: cypress-io/github-action@v6.10.2
        with:
          install: false
          build: npm run cypress:prepare

      - name: Upload Cypress artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: cypress-artifacts
          path: |
            cypress/videos
            cypress/screenshots
